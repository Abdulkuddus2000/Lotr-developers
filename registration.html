<!DOCTYPE html>
<html lang="nl-BE">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/images/logo.png" />
    <title>Lord Of The Rings - Registratie</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="registration">
    <header>
        <figure>
            <a href="landing.html">
                <img src="assets/images/logo.png" alt="logo Lord Of The Rings" height="100px">
            </a>
        </figure>
    </header>
    <main>
        <h2>Registreer</h2>
        <form action="" method="post">
            <label for="firstname">Gebruikersnaam</label>
            <input type="text" id="username" name="username" placeholder="John123">
            <br>

            <label for="password">Wachtwoord</label>
            <input type="password" id="password" name="password" placeholder="*****">
            <br>

            <label for="confirm-password">Bevestig uw wachtwoord</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="*****">
            <br>

            <a href="resetPassword.html">
                <p class="forgot-password">Wachtwoord vergeten?</p>
            </a>
            <br>

            <button type="submit">Bevestig</button>
        </form>
    </main>
    <footer>
        &copy; Copyright WPL Projects 2024-2025
    </footer>
</body>

</html>
