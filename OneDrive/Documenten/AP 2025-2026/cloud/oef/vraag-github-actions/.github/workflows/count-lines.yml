name: Count Lines and Email

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  count-and-email:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Create helloworld.js
        run: |
          cat > helloworld.js << 'EOF'
          const express = require('express')
          const app = express()
          const port = 3000

          app.get('/', (req, res) => {
            res.send('Hello World!')
          })

          app.listen(port, () => {
            console.log(`Example app listening on port ${port}`)
          })
          EOF
      
      - name: Count lines
        run: wc -l helloworld.js > /tmp/linesofcode.txt
      
      - name: Send email
        uses: devellany/send-mailer@v1.0.2
        with:
          host: smtp.gmail.com
          port: 465
          account: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          sender: GitHub Actions
          from: ${{ secrets.MAIL_USERNAME }}
          to: ${{ secrets.MAIL_USERNAME }}
          subject: Aantal regels code
          body: Het aantal regels code staat in de bijlage.
          contentType: text/plain
          attachments: '[{"path":"/tmp/linesofcode.txt"}]'