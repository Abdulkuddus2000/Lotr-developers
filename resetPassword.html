<!DOCTYPE html>
<html lang="nl-BE">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/images/logo.png" />
    <title>Lord Of The Rings - Reset Password</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="js/resetPassword.js" defer></script>
</head>

<body class="resetPassword">
    <header>
        <figure>
            <a href="landing.html">
                <img src="assets/images/logo.png" alt="logo Lord Of The Rings" height="100px">
            </a>
        </figure>
    </header>
    <main>
        <h2>Herstel wachtwoord</h2>
        <form method="post">
            <label for="resetPassword1">Geef nieuwe wachtwoord in:</label>
            <input type="password" name="resetPassword1" id="resetPassword1" placeholder="*****">
            <i class="fa fa-eye eyeIcon eyeIcon1" onmousedown="toggleVisibillityOnMouseDown(event)"
                onmouseup="toggleVisibillityOnMouseUp(event)"></i>
            <br>


            <label for="resetPassword2">Bevestig nieuwe wachtwoord:</label>
            <input type="password" name="resetPassword2" id="resetPassword2" placeholder="*****">
            <i class="fa fa-eye eyeIcon eyeIcon1" onmousedown="toggleVisibillityOnMouseDown(event)"
                onmouseup="toggleVisibillityOnMouseUp(event)"></i>

            <button type="submit" id="submit">Herstel wachtwoord</button>
        </form>
    </main>
    <footer>
        &copy; Copyright WPL Projects 2024-2025 - Abdul Kosimov, Hakki Turaç, Metin Molov, Nabil Habrani
    </footer>
</body>

</html>
